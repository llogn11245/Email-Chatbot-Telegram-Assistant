services:
  db:
    image: postgres:16-alpine
    container_name: chatbot-gmail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 12

  chatbot-gmail:
    build: .
    container_name: chatbot-gmail
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://chatbot:chatbot@db:5432/chatbot
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
